[project]
name = "pace-optimizer"
version = "0.1.0"
description = "PACE: AdamW with a pullback toward an EMA of the iterates"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Kwok Chun Au" }, { name = "Adam Block" }]
dependencies = ["torch>=2.4", "typing-extensions>=4.0"]

[project.urls]
Paper = "https://arxiv.org/abs/2606.25086"
Repository = "https://github.com/leonou2010/pace-optimizer"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pace"]
