id: fig_appendix_pretrain_kappa_sweep
paper: "Fig 9"
desc: "GPT-2-124M FineWeb pretraining c-sweep, one panel per EMA power kappa in {0.2,0.5,0.7}"
dataset: fineweb

# Full EXP25 (coarse) + EXP26 (zoom) const-LR sweep, plotted as final val loss vs c
# with one panel per kappa. AdamW (kappa-independent) and EMA(c=0) anchor the leftmost
# ticks; PACE lines sweep c. non-PACE/AdamW/EMA baselines omitted. Seed 42, constant LR.

sweeps:
  # ---- EXP25 coarse grid: kappas {0.2,0.5,0.7} ----
  - {model: gpt2_124m, base: {method: AdamW, optimizer: {name: adamw, lambda_pullback: 0.0}, schedule: const, seed: 42},
     grid: {optimizer.lr: [0.0003, 0.001, 0.002, 0.003, 0.01]}}
  - {model: gpt2_124m, base: {method: EMA, optimizer: {name: ema, lambda_pullback: 0.0}, schedule: const, seed: 42},
     grid: {optimizer.lr: [0.0003, 0.001, 0.002, 0.003, 0.01],
            optimizer.ema_kappa: [0.2, 0.5, 0.7]}}
  - {model: gpt2_124m, base: {method: PACE, optimizer: {name: pace}, schedule: const, seed: 42},
     grid: {optimizer.lr: [0.0003, 0.001, 0.002, 0.003, 0.01],
            optimizer.ema_kappa: [0.2, 0.5, 0.7],
            optimizer.lambda_pullback: [0.0001, 0.001, 0.003, 0.01, 0.03, 0.1, 0.3]}}
  # ---- EXP26 zoom grid: kappa 0.5 only ----
  - {model: gpt2_124m, base: {method: AdamW, optimizer: {name: adamw, lambda_pullback: 0.0}, schedule: const, seed: 42},
     grid: {optimizer.lr: [0.0015, 0.002, 0.0025]}}
  - {model: gpt2_124m, base: {method: EMA, optimizer: {name: ema, lambda_pullback: 0.0, ema_kappa: 0.5}, schedule: const, seed: 42},
     grid: {optimizer.lr: [0.0015, 0.002, 0.0025]}}
  - {model: gpt2_124m, base: {method: PACE, optimizer: {name: pace, ema_kappa: 0.5}, schedule: const, seed: 42},
     grid: {optimizer.lr: [0.0015, 0.002, 0.0025],
            optimizer.lambda_pullback: [0.001, 0.0015, 0.002, 0.0025, 0.003, 0.004, 0.005, 0.007, 0.01]}}
