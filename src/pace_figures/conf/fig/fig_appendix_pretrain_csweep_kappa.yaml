id: fig_appendix_pretrain_csweep_kappa
paper: "Fig 19"
desc: "GPT-2-124M FineWeb pretraining per-kappa c-sweep, one panel per schedule (const/cos/wsd)"
dataset: fineweb

# Strictly-fair shared 33-config-per-schedule grid at eta=2e-3, seed 42:
# AdamW + EMA(x4 kappa) + PACE(x4 kappa x7 c). One panel per schedule, one line per
# kappa in {0.1,0.2,0.3,0.5}. AdamW (kappa-independent) and EMA(c=0) anchor the leftmost
# ticks. non-PACE/AdamW/EMA baselines omitted.

sweeps:
  - {model: gpt2_124m, base: {method: AdamW, optimizer: {name: adamw, lr: 0.002, lambda_pullback: 0.0}, seed: 42},
     grid: {schedule: [const, cos, wsd]}}
  - {model: gpt2_124m, base: {method: EMA, optimizer: {name: ema, lr: 0.002, lambda_pullback: 0.0}, seed: 42},
     grid: {schedule: [const, cos, wsd],
            optimizer.ema_kappa: [0.1, 0.2, 0.3, 0.5]}}
  - {model: gpt2_124m, base: {method: PACE, optimizer: {name: pace, lr: 0.002}, seed: 42},
     grid: {schedule: [const, cos, wsd],
            optimizer.ema_kappa: [0.1, 0.2, 0.3, 0.5],
            optimizer.lambda_pullback: [0.0003, 0.001, 0.002, 0.003, 0.005, 0.007, 0.01]}}
