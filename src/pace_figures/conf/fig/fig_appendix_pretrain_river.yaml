id: fig_appendix_pretrain_river
paper: "Fig 20"
desc: "GPT-2-124M FineWeb pretraining token-budget comparison: WSD decay branches vs PACE constant"
dataset: fineweb

# Token-budget figure. Each method (AdamW / EMA / PACE) is trained with WSD decay
# at eta=2e-3 (the matched WSD-sweep cell: EMA/PACE kappa=0.25, PACE c=0.003), then
# the figure overlays the {50%, 75%, 100%} token-budget branches of that run on a single
# PACE constant-LR trajectory (c=0.002, kappa=0.5).
#
# NOTE: the only knob distinguishing the three branches of a method is the WSD decay
# *token budget* (where the decay starts). The shipped trainer does not expose that as a
# flag, so the branches are not separate runs here — each method appears once below
# (the canonical full-budget wsd_*_lr0.002 run). See the README pretraining-scope note:
# the GPT-2 pretraining figures are catalogued for reference, not runnable by the SFT trainer.

curves:
  # ---- WSD methods (eta=2e-3, matched cell kappa=0.25, PACE c=0.003) ----
  - {model: gpt2_124m, method: AdamW, schedule: wsd, seed: 42, optimizer: {name: adamw, lr: 0.002, lambda_pullback: 0.0}}
  - {model: gpt2_124m, method: EMA, schedule: wsd, seed: 42, optimizer: {name: ema, lr: 0.002, lambda_pullback: 0.0, ema_kappa: 0.25}}
  - {model: gpt2_124m, method: PACE, schedule: wsd, seed: 42, optimizer: {name: pace, lr: 0.002, lambda_pullback: 0.003, ema_kappa: 0.25}}
  # ---- PACE constant-LR reference trajectory (c=0.002, kappa=0.5) ----
  - {model: gpt2_124m, method: PACE, schedule: const, seed: 42, optimizer: {name: pace, lr: 0.002, lambda_pullback: 0.002, ema_kappa: 0.5}}
