id: fig_appendix_pretrain_csweep
paper: "Fig 18"
desc: "GPT-2-124M FineWeb pretraining c-sweep across schedules, 3 seeds {0,1,42}, mean +/- std"
dataset: fineweb

# Strictly-fair shared grid at eta=2e-3: AdamW + EMA(x4 kappa) + PACE(x4 kappa x7 c),
# run at three seeds {0,1,42}, one line per schedule (const/cos/wsd). Plotted points are
# best-over-kappa per c. EMA(c=0) and AdamW anchor the leftmost ticks. non-PACE/AdamW/EMA baselines omitted.

sweeps:
  - {model: gpt2_124m, base: {method: AdamW, optimizer: {name: adamw, lr: 0.002, lambda_pullback: 0.0}},
     grid: {schedule: [const, cos, wsd], seed: [0, 1, 42]}}
  - {model: gpt2_124m, base: {method: EMA, optimizer: {name: ema, lr: 0.002, lambda_pullback: 0.0}},
     grid: {schedule: [const, cos, wsd], seed: [0, 1, 42],
            optimizer.ema_kappa: [0.1, 0.2, 0.3, 0.5]}}
  - {model: gpt2_124m, base: {method: PACE, optimizer: {name: pace, lr: 0.002}},
     grid: {schedule: [const, cos, wsd], seed: [0, 1, 42],
            optimizer.ema_kappa: [0.1, 0.2, 0.3, 0.5],
            optimizer.lambda_pullback: [0.0003, 0.001, 0.002, 0.003, 0.005, 0.007, 0.01]}}
