id: fig5_pretraining
paper: "Fig 5"
desc: "GPT-2-124M FineWeb pretraining: const best-config / c-sweep (kappa=0.5) / WSD best-config"
dataset: fineweb

# 1x3 figure. Left/Right are explicit best-config trajectories at lr=2e-3 on the
# shared schedule grid (const / WSD). The middle panel is the c-sweep at kappa=0.5,
# fed by the EXP25 (coarse) + EXP26 (zoom) sweeps over AdamW / EMA(k=0.5) / PACE(k=0.5).
# Methods: AdamW (lambda_pullback=0, no kappa); EMA (lambda_pullback=0, ema_kappa=k);
# PACE (lambda_pullback=c, ema_kappa=k). Schedule-Free runs dropped.

curves:
  # ---- Left panel: Constant-LR best config per method (lr=2e-3) ----
  - {model: gpt2_124m, method: AdamW, schedule: const, seed: 42, optimizer: {name: adamw, lr: 0.002, lambda_pullback: 0.0}}
  - {model: gpt2_124m, method: EMA,   schedule: const, seed: 42, optimizer: {name: ema,   lr: 0.002, lambda_pullback: 0.0,   ema_kappa: 0.5}}
  - {model: gpt2_124m, method: PACE,  schedule: const, seed: 42, optimizer: {name: pace,  lr: 0.002, lambda_pullback: 0.002, ema_kappa: 0.5}}
  # ---- Right panel: WSD best config per method (lr=2e-3) ----
  - {model: gpt2_124m, method: AdamW, schedule: wsd, seed: 42, optimizer: {name: adamw, lr: 0.002, lambda_pullback: 0.0}}
  - {model: gpt2_124m, method: EMA,   schedule: wsd, seed: 42, optimizer: {name: ema,   lr: 0.002, lambda_pullback: 0.0,   ema_kappa: 0.2}}
  - {model: gpt2_124m, method: PACE,  schedule: wsd, seed: 42, optimizer: {name: pace,  lr: 0.002, lambda_pullback: 0.002, ema_kappa: 0.2}}

sweeps:
  # ---- Middle panel source grid: EXP25 coarse sweep at kappa=0.5 ----
  - {model: gpt2_124m, base: {method: AdamW, optimizer: {name: adamw, lambda_pullback: 0.0}, schedule: const, seed: 42},
     grid: {optimizer.lr: [0.0003, 0.001, 0.002, 0.003, 0.01]}}
  - {model: gpt2_124m, base: {method: EMA, optimizer: {name: ema, lambda_pullback: 0.0, ema_kappa: 0.5}, schedule: const, seed: 42},
     grid: {optimizer.lr: [0.0003, 0.001, 0.002, 0.003, 0.01]}}
  - {model: gpt2_124m, base: {method: PACE, optimizer: {name: pace, ema_kappa: 0.5}, schedule: const, seed: 42},
     grid: {optimizer.lr: [0.0003, 0.001, 0.002, 0.003, 0.01],
            optimizer.lambda_pullback: [0.0001, 0.001, 0.003, 0.01, 0.03, 0.1, 0.3]}}
  # ---- Middle panel source grid: EXP26 zoom sweep at kappa=0.5 ----
  - {model: gpt2_124m, base: {method: AdamW, optimizer: {name: adamw, lambda_pullback: 0.0}, schedule: const, seed: 42},
     grid: {optimizer.lr: [0.0015, 0.002, 0.0025]}}
  - {model: gpt2_124m, base: {method: EMA, optimizer: {name: ema, lambda_pullback: 0.0, ema_kappa: 0.5}, schedule: const, seed: 42},
     grid: {optimizer.lr: [0.0015, 0.002, 0.0025]}}
  - {model: gpt2_124m, base: {method: PACE, optimizer: {name: pace, ema_kappa: 0.5}, schedule: const, seed: 42},
     grid: {optimizer.lr: [0.0015, 0.002, 0.0025],
            optimizer.lambda_pullback: [0.001, 0.0015, 0.002, 0.0025, 0.003, 0.004, 0.005, 0.007, 0.01]}}
