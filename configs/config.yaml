defaults:
  - model: smollm2_135m
  - dataset: smoltalk
  - optimizer: pace
  - schedule: const
  - _self_

seed: 42
out_dir: runs

training:
  epochs: 1
  batch_size: 8
  gradient_accumulation_steps: ${model.gradient_accumulation_steps}
  grad_clip: 1.0
  eval_interval: 100
  eval_samples: null                # null = full validation set
  max_steps: ${model.max_steps}

wandb:
  enabled: false
  project: pace
  entity: null

hydra:
  output_subdir: null
  run:
    dir: .
