id: fig1
paper: "Fig 1"
desc: "Three-seed WSD validation trajectories; means and min-max bands"
dataset: smoltalk

# Three models x three methods x three seeds, all under WSD.
sweeps:
  - model: smollm2_1.7b
    base: {method: AdamW, optimizer: {name: adamw, lr: 0.001, lambda_pullback: 0.0}}
    grid:
      schedule: [wsd]
      seed: [42, 1337, 2024]
  - model: smollm2_1.7b
    base: {method: EMA, optimizer: {name: ema, lr: 0.001, lambda_pullback: 0.0, ema_kappa: 0.5}}
    grid:
      schedule: [wsd]
      seed: [42, 1337, 2024]
  - model: smollm2_1.7b
    base: {method: PACE, optimizer: {name: pace, lr: 0.001, lambda_pullback: 0.15, ema_kappa: 0.2}}
    grid:
      schedule: [wsd]
      seed: [42, 1337, 2024]
  - model: qwen3_1.7b
    base: {method: AdamW, optimizer: {name: adamw, lr: 0.0005, lambda_pullback: 0.0}}
    grid:
      schedule: [wsd]
      seed: [42, 1337, 2024]
  - model: qwen3_1.7b
    base: {method: EMA, optimizer: {name: ema, lr: 0.0005, lambda_pullback: 0.0, ema_kappa: 0.5}}
    grid:
      schedule: [wsd]
      seed: [42, 1337, 2024]
  - model: qwen3_1.7b
    base: {method: PACE, optimizer: {name: pace, lr: 0.0005, lambda_pullback: 0.25, ema_kappa: 0.5}}
    grid:
      schedule: [wsd]
      seed: [42, 1337, 2024]
  - model: gemma3_1b
    base: {method: AdamW, optimizer: {name: adamw, lr: 0.001, lambda_pullback: 0.0}}
    grid:
      schedule: [wsd]
      seed: [42, 1337, 2024]
  - model: gemma3_1b
    base: {method: EMA, optimizer: {name: ema, lr: 0.001, lambda_pullback: 0.0, ema_kappa: 0.5}}
    grid:
      schedule: [wsd]
      seed: [42, 1337, 2024]
  - model: gemma3_1b
    base: {method: PACE, optimizer: {name: pace, lr: 0.001, lambda_pullback: 0.15, ema_kappa: 0.5}}
    grid:
      schedule: [wsd]
      seed: [42, 1337, 2024]
