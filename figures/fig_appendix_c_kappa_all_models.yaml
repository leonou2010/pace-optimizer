id: fig_appendix_c_kappa_all_models
paper: "Fig 6"
desc: "Learning-rate, EMA-power and pullback-strength sweeps across three models"
dataset: smoltalk

# All learning rates shown in Figure 6. The c grid lists displayed bins;
# the original plot bins nearby source values.
sweeps:
  - model: smollm2_1.7b
    base: {method: AdamW, schedule: const, seed: 42, optimizer: {name: adamw, lambda_pullback: 0.0}}
    grid:
      optimizer.lr: [0.0003, 0.0007, 0.001]
  - model: smollm2_1.7b
    base: {method: EMA, schedule: const, seed: 42, optimizer: {name: ema, lambda_pullback: 0.0}}
    grid:
      optimizer.ema_kappa: [0.2, 0.5, 0.7]
      optimizer.lr: [0.0003, 0.0007, 0.001]
  - model: smollm2_1.7b
    base: {method: PACE, schedule: const, seed: 42, optimizer: {name: pace}}
    grid:
      optimizer.ema_kappa: [0.2, 0.5, 0.7]
      optimizer.lambda_pullback: [0.0001, 0.0005, 0.001, 0.003, 0.01, 0.03, 0.1, 0.3]
      optimizer.lr: [0.0003, 0.0007, 0.001]
  - model: qwen3_1.7b
    base: {method: AdamW, schedule: const, seed: 42, optimizer: {name: adamw, lambda_pullback: 0.0}}
    grid:
      optimizer.lr: [0.0003, 0.0005]
  - model: qwen3_1.7b
    base: {method: EMA, schedule: const, seed: 42, optimizer: {name: ema, lambda_pullback: 0.0}}
    grid:
      optimizer.ema_kappa: [0.2, 0.5, 0.7]
      optimizer.lr: [0.0003, 0.0005]
  - model: qwen3_1.7b
    base: {method: PACE, schedule: const, seed: 42, optimizer: {name: pace}}
    grid:
      optimizer.ema_kappa: [0.2, 0.5, 0.7]
      optimizer.lambda_pullback: [0.0001, 0.0005, 0.001, 0.003, 0.01, 0.03, 0.1, 0.3]
      optimizer.lr: [0.0003, 0.0005]
  - model: gemma3_1b
    base: {method: AdamW, schedule: const, seed: 42, optimizer: {name: adamw, lambda_pullback: 0.0}}
    grid:
      optimizer.lr: [0.001, 0.005]
  - model: gemma3_1b
    base: {method: EMA, schedule: const, seed: 42, optimizer: {name: ema, lambda_pullback: 0.0}}
    grid:
      optimizer.ema_kappa: [0.2, 0.5, 0.7]
      optimizer.lr: [0.001, 0.005]
  - model: gemma3_1b
    base: {method: PACE, schedule: const, seed: 42, optimizer: {name: pace}}
    grid:
      optimizer.ema_kappa: [0.2, 0.5, 0.7]
      optimizer.lambda_pullback: [0.0001, 0.0005, 0.001, 0.003, 0.01, 0.03, 0.1, 0.3]
      optimizer.lr: [0.001, 0.005]
